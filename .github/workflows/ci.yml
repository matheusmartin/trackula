# Checks each pull request, and each push to main: compile, ktlint and tests. See CLAUDE.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run for each branch. A newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Compiles and packs each module with warnings as errors, runs ktlint, and runs the tests on the JVM and on Wasm
      # (Node.js).
      - name: Check
        run: ./gradlew build --console=plain
