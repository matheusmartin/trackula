# Checks each pull request, and each push to main: ESLint, Prettier, the type check, the tests and the build. See
# CLAUDE.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run for each branch. A newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ESLint, Prettier, the type check, the tests and the build.
      - name: Check
        run: npm run check
