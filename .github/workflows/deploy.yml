# Builds the app and publishes it to GitHub Pages on each push to main.
# Setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push cancels a waiting deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The build values: see buildValue in vite.config.js. Set them in Settings → Secrets and variables → Actions →
      # Secrets. They are public in the built app. Secrets only keep them out of the repository and the logs.
      # npm run check also runs the checks and the tests before the build.
      - name: Build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::Set the GOOGLE_CLIENT_ID and GOOGLE_API_KEY repository secrets."
            exit 1
          fi
          npm run check

      # The page can load code, styles and data only from these origins. The page keeps the Google access token in
      # memory: this limits where other code can come from and where it can send data.
      # - accounts.google.com/gsi: Google sign-in. apis.google.com and docs.google.com: the Google Picker.
      #   sheets.googleapis.com: the Sheets API. The fonts (Roboto and Material Symbols) come from the app itself.
      #   Emojis use the fonts of the device.
      # - 'unsafe-inline' styles: the style element in index.html, the style attributes of the app (for example the
      #   position of the ruler), and the styles of Google sign-in and the Picker.
      # If you add a script, a font or an API from another origin, add the origin here.
      - name: Add the Content Security Policy
        env:
          CSP: >-
            default-src 'self';
            script-src 'self' https://accounts.google.com/gsi/client https://apis.google.com;
            style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style;
            font-src 'self';
            img-src 'self' data: https:;
            connect-src 'self' https://sheets.googleapis.com https://accounts.google.com/gsi/
            https://apis.google.com;
            frame-src https://accounts.google.com/gsi/ https://docs.google.com;
            worker-src 'self';
            manifest-src 'self';
            object-src 'none';
            base-uri 'self';
            form-action 'none'
        run: |
          python3 - <<'EOF'
          import os
          path = 'dist/index.html'
          marker = '<!-- content-security-policy -->'
          html = open(path).read()
          if marker not in html:
              raise SystemExit(f'::error::{path} has no "{marker}" line.')
          meta = f'<meta http-equiv="Content-Security-Policy" content="{os.environ["CSP"]}">'
          open(path, 'w').write(html.replace(marker, meta))
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
