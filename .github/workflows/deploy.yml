# Builds the app and publishes it to GitHub Pages on each push to main.
# Setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push cancels a waiting deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4

      - name: Install dependencies
        run: dart pub get

      - name: Test
        run: dart test

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.5

      # The Kotlin port (kmp/) goes in the kotlin/ folder, next to the Dart app, until it replaces the Dart app.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Values for lib/config.dart. Set them in Settings → Secrets and variables → Actions → Secrets.
      # They are public in the built app. Secrets only keep them out of the repository and the logs.
      - name: Build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::Set the GOOGLE_CLIENT_ID and GOOGLE_API_KEY repository secrets."
            exit 1
          fi
          jaspr build --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" --dart-define=GOOGLE_API_KEY="$GOOGLE_API_KEY"
          (cd kmp && ./gradlew build :app:wasmJsBrowserDistribution)
          cp -r kmp/app/build/dist/wasmJs/productionExecutable build/jaspr/kotlin

      # The page can load code, styles and data only from these origins. The page keeps the Google access token in
      # memory: this limits where other code can come from and where it can send data.
      # - cdn.jsdelivr.net: BeerCSS. accounts.google.com/gsi: Google sign-in. apis.google.com and docs.google.com: the
      #   Google Picker. sheets.googleapis.com: the Sheets API.
      # - 'unsafe-inline' styles: the app sets style attributes, for example the ruler position.
      # - The Kotlin app (KOTLIN_CSP) does not use BeerCSS. It needs 'wasm-unsafe-eval' to start its WebAssembly code.
      #   Compose loads fallback fonts (Noto) for characters that its own fonts do not have from fonts.gstatic.com.
      # If you add a script, a font or an API from another origin, add the origin here.
      - name: Add the Content Security Policy
        env:
          CSP: >-
            default-src 'self';
            script-src 'self' https://cdn.jsdelivr.net https://accounts.google.com/gsi/client https://apis.google.com;
            style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com/gsi/style;
            font-src 'self' https://cdn.jsdelivr.net;
            img-src 'self' data: https:;
            connect-src 'self' https://cdn.jsdelivr.net https://sheets.googleapis.com https://accounts.google.com/gsi/
            https://apis.google.com;
            frame-src https://accounts.google.com/gsi/ https://docs.google.com;
            worker-src 'self';
            manifest-src 'self';
            object-src 'none';
            base-uri 'self';
            form-action 'none'
          KOTLIN_CSP: >-
            default-src 'self';
            script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client https://apis.google.com;
            style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style;
            font-src 'self' https://fonts.gstatic.com;
            img-src 'self' data: https:;
            connect-src 'self' https://fonts.gstatic.com https://sheets.googleapis.com https://accounts.google.com/gsi/
            https://apis.google.com;
            frame-src https://accounts.google.com/gsi/ https://docs.google.com;
            worker-src 'self';
            manifest-src 'self';
            object-src 'none';
            base-uri 'self';
            form-action 'none'
        run: |
          python3 - <<'EOF'
          import os
          marker = '<!-- content-security-policy -->'
          for path, csp in [('build/jaspr/index.html', 'CSP'), ('build/jaspr/kotlin/index.html', 'KOTLIN_CSP')]:
              html = open(path).read()
              if marker not in html:
                  raise SystemExit(f'::error::{path} has no "{marker}" line.')
              meta = f'<meta http-equiv="Content-Security-Policy" content="{os.environ[csp]}">'
              open(path, 'w').write(html.replace(marker, meta))
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/jaspr

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
