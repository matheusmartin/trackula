<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Trackula</title>

        <!-- Fang T logo. favicon.ico is the same logo, for browsers without SVG icons. -->
        <link rel="icon" type="image/svg+xml" href="images/logo.svg">

        <!-- BeerCSS: Material Design 3 styles and Material Symbols icons. Pinned version.
             integrity: the browser does not use a file that is different from the pinned version. If you change the
             version, set the new hashes: openssl dgst -sha384 -binary FILE | openssl base64 -A -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css"
              integrity="sha384-EqZ6IXmk+4jeYN6dm7SEK3B8T8AMiHLEujTTup/LU1rSEjt1Ce8Vz8uI6NQ8czHg" crossorigin="anonymous">
        <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"
                integrity="sha384-7xZPd8qp8XUHrLKlKeZKr5yHcqeQ0Juz7GLT0AOsAIMhtHNqKJg5bfFCj782KnFh" crossorigin="anonymous"></script>

        <!-- Ember color theme. Loads after BeerCSS, so it replaces the BeerCSS colors. -->
        <link rel="stylesheet" href="theme.css">

        <!-- App styles from the @css declarations. Loads after BeerCSS, so it can override it. -->
        <link rel="stylesheet" href="main.css">

        <!-- Loads and runs the compiled 'main.client.dart' file. -->
        <script defer src="main.client.dart.js"></script>
    </head>
    <body class="light">
        <!-- The app component is inserted here. -->
    </body>
</html>
