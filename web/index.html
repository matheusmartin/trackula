<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Trackula</title>

        <!-- Fang T logo. favicon.ico is the same logo, for browsers without SVG icons. -->
        <link rel="icon" type="image/svg+xml" href="images/logo.svg">

        <!-- BeerCSS: Material Design 3 styles and Material Symbols icons. Pinned version. -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css">
        <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"></script>

        <!-- Blood orange color theme. Loads after BeerCSS, so it replaces the BeerCSS colors. -->
        <link rel="stylesheet" href="theme.css">

        <!-- App styles from the @css declarations. Loads after BeerCSS, so it can override it. -->
        <link rel="stylesheet" href="main.css">

        <!-- Loads and runs the compiled 'main.client.dart' file. -->
        <script defer src="main.client.dart.js"></script>
    </head>
    <body class="light">
        <!-- The app component is inserted here. -->
    </body>
</html>
