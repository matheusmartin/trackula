org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# The Kotlin compiler daemon. The production Wasm build of the app needs more than 2 GB: with the 2 GB of the Gradle
# daemon, the deploy failed with "Not enough memory to run compilation".
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.caching=true
# Gradle keeps the result of the configuration phase and uses it again when the build files did not change.
org.gradle.configuration-cache=true
kotlin.code.style=official
# npm, not Yarn, installs the JavaScript test tools. Yarn gets the Kotlin fork of Karma from codeload.github.com, and
# some networks block that host. npm gets it with git.
kotlin.js.yarn=false
